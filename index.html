<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Mini Games Obby Challenge</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/BogVK.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/BogVK.data.unityweb" as="fetch" crossorigin>
        <link rel="preload" href="Build/BogVK.framework.js.unityweb" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
            }
            .fullscreen-canvas {
                background: #242424;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
            .pre-playgama-loader {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
                pointer-events: none;
            }
            .pre-playgama-loader.hidden {
                display: none;
            }
            .pre-playgama-loader__bar {
                width: min(280px, 60vw);
                height: 8px;
                overflow: hidden;
                border-radius: 999px;
                background: rgba(139, 61, 255, 0.25);
            }
            .pre-playgama-loader__fill {
                width: 45%;
                height: 100%;
                border-radius: inherit;
                background: #8b3dff;
                animation: pre-playgama-loading 1.1s ease-in-out infinite;
            }
            @keyframes pre-playgama-loading {
                0% {
                    transform: translateX(-110%);
                }
                100% {
                    transform: translateX(230%);
                }
            }
        </style>
    </head>
    <body>
        <div id="pre-playgama-loader" class="pre-playgama-loader">
            <div class="pre-playgama-loader__bar">
                <div class="pre-playgama-loader__fill"></div>
            </div>
        </div>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
